<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>WhatsApp</title>
  <style>
    :root { color-scheme: light dark; --bg: #eef1f4; --panel: #fff; --line: #dfe3e8; --text: #1d2329; --muted: #66727f; --bubble: #e7f0ff; --mine: #dff6e6; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0e1418; --panel: #151d23; --line: #25313a; --text: #e4e9ee; --muted: #8b98a5; --bubble: #1f2b38; --mine: #1d3327; } }
    * { box-sizing: border-box; }
    body { margin: 0; height: 100vh; font: 14px system-ui, sans-serif; background: var(--bg); color: var(--text); }
    #app { height: 100%; }
    .banner { position: fixed; right: 12px; bottom: 12px; padding: 4px 10px; border-radius: 999px; background: #f59e0b; color: #111; font-size: 12px; font-weight: 600; }
    .linking { height: 100%; display: flex; align-items: center; justify-content: center; }
    .card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 32px; display: flex; gap: 32px; align-items: center; max-width: 760px; }
    .card h1 { margin: 0 0 12px; font-size: 24px; }
    .card ol { color: var(--muted); line-height: 1.8; padding-left: 20px; }
    .qr { width: 200px; height: 200px; flex: none; border-radius: 8px; background:
      conic-gradient(from 90deg at 25% 25%, #111 0 25%, #fff 0 50%, #111 0 75%, #fff 0) 0 0 / 40px 40px; border: 10px solid #fff; outline: 1px solid var(--line); }
    .layout { display: grid; grid-template-columns: 320px 1fr; height: 100%; }
    #pane-side { border-right: 1px solid var(--line); background: var(--panel); overflow: auto; }
    .side-head { padding: 16px; font-weight: 700; font-size: 18px; border-bottom: 1px solid var(--line); }
    .chat { display: flex; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
    .chat .pic { width: 42px; height: 42px; border-radius: 50%; flex: none; }
    .chat .name { font-weight: 600; }
    .chat .last { color: var(--muted); font-size: 13px; }
    .chat .count { margin-left: auto; align-self: center; background: #3b82f6; color: #fff; border-radius: 10px; padding: 0 7px; font-size: 12px; font-weight: 700; }
    .conversation { display: flex; flex-direction: column; min-width: 0; }
    .conv-head { padding: 14px 18px; background: var(--panel); border-bottom: 1px solid var(--line); font-weight: 600; }
    .messages { flex: 1; padding: 18px; display: flex; flex-direction: column; gap: 8px; overflow: auto; }
    .msg { max-width: 60%; padding: 8px 12px; border-radius: 10px; background: var(--bubble); }
    .msg.mine { align-self: flex-end; background: var(--mine); }
    .tools { padding: 10px 18px; display: flex; flex-wrap: wrap; gap: 6px; background: var(--panel); border-top: 1px solid var(--line); }
    .tools button, .tools a { padding: 6px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: inherit; font: inherit; font-size: 12.5px; text-decoration: none; cursor: pointer; }
    .composer { margin: 0 18px 10px; padding: 10px 12px; min-height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); }
    .photo { width: 120px; height: 80px; border-radius: 8px; display: block; }
  </style>
</head>
<body>
  <div id="app"></div>
  <div class="banner">Fausse page WhatsApp — tests</div>
  <script>
    const app = document.getElementById("app");
    if (!localStorage.getItem("fakePageId")) localStorage.setItem("fakePageId", crypto.randomUUID());
    let unread = 0;
    let streams = [];
    const setUnread = (count) => { unread = count; document.title = count > 0 ? `(${count}) WhatsApp` : "WhatsApp"; };

    const CHATS = [
      ["Marie", "On se voit demain ?", "#f472b6", 2],
      ["Équipe produit", "Paul : la démo est prête", "#60a5fa", 1],
      ["Support client", "Merci pour votre retour", "#34d399", 0],
      ["Maman", "Bisous ❤️", "#fbbf24", 0],
      ["Club de vélo", "Sortie dimanche 9 h", "#a78bfa", 0]
    ];

    function renderLinking() {
      app.innerHTML = `
        <div class="linking">
          <div class="card">
            <div class="qr" data-testid="link-device-qr-code" data-ref="fake-qr-data" role="img" aria-label="QR code"></div>
            <div>
              <h1>Scannez pour vous connecter</h1>
              <ol><li>Ouvrez WhatsApp sur votre téléphone</li><li>Appareils connectés → Connecter un appareil</li><li>Scannez ce QR code</li></ol>
              <button id="link" data-testid="link_device_fake_button">Simuler la liaison</button>
            </div>
          </div>
        </div>`;
      document.getElementById("link").onclick = () => fake.link();
    }

    function renderChats() {
      app.innerHTML = `
        <div class="layout">
          <div id="pane-side">
            <div class="side-head">Discussions</div>
            ${CHATS.map(([name, last, color, count]) => `
              <div class="chat"><span class="pic" style="background:${color}"></span>
                <div><div class="name">${name}</div><div class="last" data-testid="cell-frame-secondary">${last}</div></div>
                ${count ? `<span class="count">${count}</span>` : ""}
              </div>`).join("")}
          </div>
          <div class="conversation" id="main">
            <div class="conv-head">Marie</div>
            <div class="messages">
              <div class="msg" data-pre-plain-text="[09:58, 05/10/2026] Marie: ">Salut ! Tu as vu le planning ?</div>
              <div class="msg mine" data-pre-plain-text="[09:59, 05/10/2026] Moi: ">Oui, je regarde ça ce soir.</div>
              <div class="msg"><img id="photo" class="photo" alt="Photo" src="${PHOTO}"></div>
              <div class="msg" data-pre-plain-text="[10:00, 05/10/2026] Marie: ">On se voit demain ?</div>
            </div>
            <div id="composer" class="composer" contenteditable="true" role="textbox" aria-label="Écrire un message"></div>
            <div class="tools">
              <button id="notify">Notification</button>
              <button id="call">Appel entrant</button>
              <button id="unread">+1 non-lu</button>
              <button id="mic">Micro</button>
              <button id="stop">Arrêter les pistes</button>
              <button id="popup">Popup</button>
              <a href="https://example.com/" target="_blank" id="external">Lien externe</a>
              <a href="https://wa.me/33612345678" target="_blank" id="wame">Lien wa.me</a>
              <button id="download">Télécharger</button>
              <button id="logout">Simuler déconnexion</button>
            </div>
          </div>
        </div>`;
      const on = (id, handler) => (document.getElementById(id).onclick = handler);
      on("notify", () => fake.notify("Marie", "On se voit demain ?", "chat-marie"));
      on("call", () => fake.notify("Paul", "Appel vocal entrant", "call-paul"));
      on("unread", () => setUnread(unread + 1));
      on("mic", () => fake.mic());
      on("stop", () => fake.stop());
      on("popup", () => window.open("/popup", "_blank", "width=420,height=320"));
      on("download", () => fake.download());
      on("logout", () => fake.logout());
    }

    // Image d'une conversation (copier l'image) et sons de test.
    const PHOTO = (() => {
      const canvas = document.createElement("canvas");
      canvas.width = 120;
      canvas.height = 80;
      const context = canvas.getContext("2d");
      context.fillStyle = "#3b82f6";
      context.fillRect(0, 0, 120, 80);
      context.fillStyle = "#fbbf24";
      context.fillRect(20, 20, 40, 40);
      return canvas.toDataURL("image/png");
    })();
    function wavBlob(seconds) {
      const rate = 8000;
      const samples = Math.round(rate * seconds);
      const buffer = new ArrayBuffer(44 + samples);
      const view = new DataView(buffer);
      const text = (offset, value) => [...value].forEach((char, index) => view.setUint8(offset + index, char.charCodeAt(0)));
      text(0, "RIFF"); view.setUint32(4, 36 + samples, true); text(8, "WAVE"); text(12, "fmt ");
      view.setUint32(16, 16, true); view.setUint16(20, 1, true); view.setUint16(22, 1, true);
      view.setUint32(24, rate, true); view.setUint32(28, rate, true); view.setUint16(32, 1, true); view.setUint16(34, 8, true);
      text(36, "data"); view.setUint32(40, samples, true);
      for (let index = 0; index < samples; index++) view.setUint8(44 + index, 128 + Math.round(30 * Math.sin(index / 6)));
      return new Blob([buffer], { type: "audio/wav" });
    }
    document.addEventListener("paste", (event) => {
      const files = [...(event.clipboardData?.files ?? [])].map((file) => ({ type: file.type, size: file.size }));
      fake.pastes.push({ text: event.clipboardData?.getData("text/plain") ?? "", html: event.clipboardData?.getData("text/html") ?? "", files });
    });

    window.fake = {
      clicks: [],
      pastes: [],
      audio: null,
      notify(title, body, tag, icon) {
        const notification = new Notification(title, { body, tag, ...(icon ? { icon } : {}) });
        notification.onclick = () => { fake.clicks.push(tag); setUnread(0); };
        return true;
      },
      setUnread,
      link() { localStorage.setItem("fakeLinked", "1"); renderChats(); setUnread(3); },
      logout() { localStorage.removeItem("fakeLinked"); renderLinking(); setUnread(0); },
      async mic() { streams.push(await navigator.mediaDevices.getUserMedia({ audio: true })); return true; },
      stop() { streams.forEach((stream) => stream.getTracks().forEach((track) => track.stop())); streams = []; return true; },
      /** Téléchargement servi lentement par le faux serveur (en cours pendant ms). */
      downloadSlow(name = "lent.bin", ms = 2000) {
        const link = document.createElement("a");
        link.href = `/slow-file?name=${encodeURIComponent(name)}&ms=${ms}`;
        link.download = name;
        link.click();
        return true;
      },
      download(name = "rapport.txt") {
        const link = document.createElement("a");
        link.href = URL.createObjectURL(new Blob(["contenu de test\n"], { type: "text/plain" }));
        link.download = name;
        link.click();
        return true;
      },
      /** Message vocal : élément dans le DOM, ou détaché (new Audio()). */
      async play(seconds = 6, detached = false, loop = false) {
        const audio = detached ? new Audio() : document.createElement("audio");
        if (!detached) document.body.append(audio);
        audio.loop = loop;
        audio.src = URL.createObjectURL(wavBlob(seconds));
        fake.audio = audio;
        await audio.play();
        return true;
      },
      paused: () => (fake.audio ? fake.audio.paused : null),
      focusComposer() { document.getElementById("composer")?.focus(); return true; },
      composerText: () => document.getElementById("composer")?.innerText ?? "",
      composerHtml: () => document.getElementById("composer")?.innerHTML ?? "",
      async camera() {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ video: true });
          stream.getTracks().forEach((track) => track.stop());
          return "ok";
        } catch (error) {
          return error.name;
        }
      },
      location() {
        return new Promise((resolve) => navigator.geolocation.getCurrentPosition(() => resolve("ok"), (error) => resolve(`error:${error.code}`), { timeout: 3000 }));
      },
      blurred: () => getComputedStyle(document.documentElement).filter,
      visibility: () => document.visibilityState,
      pageId: () => localStorage.getItem("fakePageId")
    };

    if (localStorage.getItem("fakeLinked") === "1") { renderChats(); setUnread(3); } else { renderLinking(); setUnread(0); }
  </script>
</body>
</html>
