# Packaging Linux : AppImage, .deb, .rpm, archive tar.gz (base du paquet AUR).
# Les paquets ne sont publiés que par le workflow release.yml (gh release) :
# toute commande locale ou de CI passe --publish never.

appId: io.github.chapdel.whathush
productName: WhatHush
executableName: whathush
copyright: "© 2026 chapdel. Independent project, not affiliated with WhatsApp LLC or Meta Platforms."

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - "!dist/**/*.map"
  - package.json

# GPL : le texte de la licence accompagne chaque binaire distribué.
extraFiles:
  - from: LICENSE
    to: LICENSE

# Fuses Electron, appliquées au binaire empaqueté.
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  grantFileProtocolExtraPrivileges: false

linux:
  target:
    - AppImage
    - deb
    - rpm
    - tar.gz
  # Catégories complètes : electron-builder écrase Categories avec cette valeur.
  category: Network;InstantMessaging;Chat
  icon: build/icons
  syncDesktopName: true
  # Déclaré ; l'option « liens whatsapp:// » des paramètres en fait le choix par défaut.
  mimeTypes:
    - x-scheme-handler/whatsapp
  maintainer: chapdel <iamchapdel@gmail.com>
  vendor: chapdel
  synopsis: Multi-account client for WhatsApp Web
  # Sert aussi de Comment dans l'entrée de bureau : rester court. Anglais par défaut,
  # français par les clés [fr], comme packaging/linux/*.desktop.
  description: Several WhatsApp Web accounts side by side, with Snooze, Focus and deep sleep. Independent project, not affiliated with WhatsApp or Meta.
  desktop:
    entry:
      GenericName: Multi-account messaging
      GenericName[fr]: Messagerie multi-comptes
      Comment[fr]: Plusieurs comptes WhatsApp Web côte à côte, avec Snooze, Focus et veille profonde. Projet indépendant, non affilié à WhatsApp ni à Meta.
      Keywords: whatsapp;messaging;chat;multi-account;snooze;
      Keywords[fr]: whatsapp;messagerie;chat;multi-comptes;snooze;

appImage:
  artifactName: ${productName}-${version}-${arch}.AppImage

deb:
  artifactName: ${name}_${version}_${arch}.deb
  depends:
    - libgtk-3-0 | libgtk-3-0t64
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0 | libatspi2.0-0t64
    - libuuid1
    - libsecret-1-0
  recommends:
    - pipewire
    - xdg-desktop-portal

rpm:
  artifactName: ${name}-${version}.${arch}.rpm
  depends:
    - gtk3
    - libnotify
    - nss
    - libXScrnSaver
    - libXtst
    - xdg-utils
    - at-spi2-core
    - libuuid
    - libsecret

# Releases GitHub : electron-builder écrit app-update.yml dans le paquet et
# latest-linux.yml à côté, ce qui active la mise à jour automatique de l'AppImage.
publish:
  provider: github
  owner: chapdel
  repo: whathush
