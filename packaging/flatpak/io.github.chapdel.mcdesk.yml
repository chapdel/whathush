# Manifeste Flatpak (§41). Construit à partir de l'archive tar.gz d'electron-builder.
# Local : sources « path » ci-dessous. Flathub : remplacer par l'URL de la release
# publiée et sa somme sha256 (les règles de Flathub sur les marques s'appliquent, §38).

app-id: io.github.chapdel.mcdesk
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '25.08'
command: whathush
separate-locales: false

finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri
  # Caméra des appels vidéo : pas encore de portail caméra utilisable par Electron.
  - --device=all
  - --talk-name=org.freedesktop.Notifications
  # Tray (§21) : StatusNotifierItem.
  - --talk-name=org.kde.StatusNotifierWatcher
  # Verrouillage avec la session (F6) : économiseur d'écran et logind, en écoute seulement.
  - --talk-name=org.freedesktop.ScreenSaver
  - --talk-name=org.gnome.ScreenSaver
  - --system-talk-name=org.freedesktop.login1
  # Identifiants de proxy chiffrés (F9) : trousseau du système via safeStorage.
  - --talk-name=org.freedesktop.secrets
  - --talk-name=org.kde.kwalletd6
  - --talk-name=org.kde.kwalletd5
  - --filesystem=xdg-download
  # Wayland natif avec saisie IME (§25).
  - --env=ELECTRON_OZONE_PLATFORM_HINT=auto

modules:
  - name: whathush
    buildsystem: simple
    sources:
      - type: archive
        path: ../../release/whathush-0.2.0.tar.gz
        dest: app
      - type: file
        path: ../linux/io.github.chapdel.mcdesk.desktop
      - type: file
        path: ../linux/io.github.chapdel.mcdesk.metainfo.xml
      - type: file
        path: ../../build/icons/512x512.png
        dest-filename: icon-512.png
      - type: file
        path: ../../build/icons/256x256.png
        dest-filename: icon-256.png
      - type: file
        path: ../../build/icons/128x128.png
        dest-filename: icon-128.png
      - type: script
        dest-filename: whathush.sh
        commands:
          # zypak : le bac à sable Chromium à l'intérieur du bac à sable Flatpak.
          - exec zypak-wrapper /app/whathush/whathush "$@"
    build-commands:
      - cp -a app /app/whathush
      - install -Dm755 whathush.sh /app/bin/whathush
      - install -Dm644 io.github.chapdel.mcdesk.desktop /app/share/applications/io.github.chapdel.mcdesk.desktop
      - install -Dm644 io.github.chapdel.mcdesk.metainfo.xml /app/share/metainfo/io.github.chapdel.mcdesk.metainfo.xml
      - install -Dm644 icon-512.png /app/share/icons/hicolor/512x512/apps/io.github.chapdel.mcdesk.png
      - install -Dm644 icon-256.png /app/share/icons/hicolor/256x256/apps/io.github.chapdel.mcdesk.png
      - install -Dm644 icon-128.png /app/share/icons/hicolor/128x128/apps/io.github.chapdel.mcdesk.png
